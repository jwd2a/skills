name: Daily Portfolio Report

on:
  schedule:
    # 4:30pm ET = 21:30 UTC, weekdays
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r portfolio/requirements.txt

      - name: Run daily report
        id: report
        run: |
          OUTPUT=$(python portfolio/report.py --cadence daily)
          echo "$OUTPUT"
          # Write to GitHub Actions summary
          echo "## $(date +'%A %b %d, %Y') — Daily Portfolio Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Persist to repo
          mkdir -p portfolio/reports
          echo "$OUTPUT" > "portfolio/reports/$(date +'%Y-%m-%d').md"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio/reports/
          git diff --cached --quiet || git commit -m "Daily portfolio report $(date +'%Y-%m-%d')"
          git push
