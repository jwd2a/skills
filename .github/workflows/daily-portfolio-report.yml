name: Daily Portfolio Report

on:
  schedule:
    # Run at 9:00 PM UTC = 5:00 PM ET (30 min after market close)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      cadence:
        description: Report cadence
        required: false
        default: daily
        type: choice
        options: [daily, weekly, monthly, quarterly, yearly]

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: portfolio/requirements.txt

      - name: Install dependencies
        run: pip install -r portfolio/requirements.txt

      - name: Determine cadence
        id: cadence
        run: |
          INPUT="${{ github.event.inputs.cadence }}"
          if [ -n "$INPUT" ]; then
            echo "value=$INPUT" >> "$GITHUB_OUTPUT"
          else
            DOW=$(date +%u)   # 1=Mon … 7=Sun
            DOM=$(date +%d)
            MONTH=$(date +%m)
            if [ "$DOM" -le 7 ] && [ "$DOW" -eq 1 ] && [ "$MONTH" = "01" ]; then
              echo "value=yearly" >> "$GITHUB_OUTPUT"
            elif [ "$DOM" -le 7 ] && [ "$DOW" -eq 1 ]; then
              echo "value=monthly" >> "$GITHUB_OUTPUT"
            elif [ "$DOW" -eq 1 ]; then
              echo "value=weekly" >> "$GITHUB_OUTPUT"
            else
              echo "value=daily" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate portfolio report
        id: report
        working-directory: portfolio
        run: |
          python report.py --cadence "${{ steps.cadence.outputs.value }}" > /tmp/report.txt 2>&1
          echo "cadence=${{ steps.cadence.outputs.value }}" >> "$GITHUB_OUTPUT"
          cat /tmp/report.txt

      - name: Post report as GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/report.txt', 'utf8');
            const cadence = '${{ steps.cadence.outputs.value }}';
            const date = new Date().toLocaleDateString('en-US', {
              weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
              timeZone: 'America/New_York'
            });

            const label = cadence.charAt(0).toUpperCase() + cadence.slice(1);
            const title = `${label} Portfolio Report — ${date}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `\`\`\`\n${report}\n\`\`\`\n\n_Generated by [daily-portfolio-report workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
              labels: ['portfolio-report'],
            });
