name: Daily Portfolio Report

on:
  schedule:
    # 9:30 PM ET weekdays (01:30 UTC next day) — ~90 min after market close
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
    inputs:
      cadence:
        description: 'Report cadence'
        required: false
        default: 'daily'
        type: choice
        options: [daily, weekly, monthly, quarterly, yearly]

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: portfolio/requirements.txt

      - name: Install dependencies
        run: pip install -r portfolio/requirements.txt

      - name: Run daily report
        id: daily
        working-directory: portfolio
        run: |
          python report.py --cadence daily > /tmp/daily.txt
          cat /tmp/daily.txt

      - name: Run trailing stops check
        id: stops
        working-directory: portfolio
        run: |
          python trailing_stops.py --status > /tmp/stops.txt 2>&1 || true
          cat /tmp/stops.txt

      - name: Assemble and save report
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          REPORT_FILE="reports/daily/${DATE}.md"
          mkdir -p reports/daily

          echo "# Portfolio Report — ${DATE}" > "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          cat /tmp/daily.txt >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "## Trailing Stops" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"
          cat /tmp/stops.txt >> "$REPORT_FILE"
          echo '```' >> "$REPORT_FILE"

          echo "REPORT_FILE=$REPORT_FILE" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Daily portfolio report — $DATE"
          git push

      - name: Post summary
        run: |
          echo "## Portfolio Report — $DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/daily.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Trailing Stops" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/stops.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
